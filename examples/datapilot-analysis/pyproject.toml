[project]
name = "datapilot-analysis"
version = "0.2.0"
description = "Owner-scoped datasets, business metrics, comparisons and charts for DataPilot"
requires-python = ">=3.12"
dependencies = ["langchain>=1.3,<2", "deerflow-extension-api>=0.2.10,<0.3", "fastapi>=0.115,<1", "openpyxl>=3.1,<4"]

[project.entry-points."deerflow.extensions"]
datapilot = "datapilot_analysis.plugin:install"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datapilot_analysis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
